publication_category:
  preprints:
    title: "Preprints"
  conference:
    title: "Conference Publications"

collections:
  pages:
    output: true
    permalink: /:path/
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
      share: false
      comments: false

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: "lsquo,rsquo,ldquo,rdquo"
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-paginate
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-paginate
  - jemoji

exclude:
  - .asset-cache
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .github
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - vendor
  - docs
  - test
  - scripts

keep_files:
  - .git
  - .svn

compress_html:
  clippings: all
  ignore:
    envs: development
